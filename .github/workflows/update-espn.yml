name: Update ESPN league data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-league:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pip

      - name: Download ESPN data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/fetch_espn.py

      - name: Commit updated league data
        run: |
          if git diff --quiet -- data/league.json; then
            exit 0
          fi
          git config user.name "LFL Bot"
          git config user.email "lfl-bot@users.noreply.github.com"
          git add data/league.json
          git commit -m "chore: update ESPN league data"
          git push
